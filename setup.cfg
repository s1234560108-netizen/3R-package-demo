[metadata]
name = three_r_package
version = attr: three_r_package.__version__
author = Shao Chien Chang
description = A Python package for the 3R course
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
    click

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    three-r = three_r_package.cli:main
